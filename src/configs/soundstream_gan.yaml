defaults:
  - model: soundstream
  - discriminator: multiscale
  - loss_function: generator
  - disc_loss_function: discriminator
  - optimizer_d: adam
  - writer: cometml
  - metrics: soundstream
  - datasets: librispeech
  - dataloader: librispeech
  - transforms: soundstream
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 1e-4
  betas: [0.5, 0.9]

lr_scheduler:
  _target_: torch.optim.lr_scheduler.LambdaLR
  lr_lambda:
    _target_: hydra.utils.get_method
    path: src.utils.const_lr.const_lr
  
trainer:
  log_step: 50
  n_epochs: 10
  epoch_len: 4500
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  device_tensors: ["audio"]
  override: True # if True, will override the previous run with the same name
  monitor: "max test_STOI" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1